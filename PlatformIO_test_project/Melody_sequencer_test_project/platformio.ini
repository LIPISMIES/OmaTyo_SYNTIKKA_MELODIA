[env:atmega328p_via_1280_isp]
platform = atmelavr
board = nanoatmega328
framework = arduino

# Lock the timing speed parameters to the 8 MHz internal clock frequency
#board_build.f_cpu = 8000000L

# =========================================================================
# FORCED PROGRAMMER CORRECTION MAP
# =========================================================================
# Directs the fuse manager to communicate explicitly over the serial interface
#upload_protocol = stk500v1
upload_speed = 115200
#upload_port = COM9      ; ◄── CHANGE THIS to match your actual Windows COM port or Linux device path!

# Use avrdude directly for the fuse step so port and baud remain separate args.

# =========================================================================
# MINICORE INTERNAL HARDWARE CORE CONFIGURATION
# =========================================================================
#board_hardware.oscillator = internal
#board_hardware.uart = no_bootloader
#board_hardware.bod = 2.7v
#board_hardware.eesave = no
